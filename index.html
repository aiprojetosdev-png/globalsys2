<title>Pulso da Operação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: admin shell — sidebar fixa à esquerda, cabeçalho fino, conteúdo em cards neutros (estilo shadcn). */
:root{
  --bg:#ffffff; --fg:#09090b; --card:#ffffff; --muted:#f4f4f5; --muted-fg:#71717a;
  --border:#e4e4e7; --input:#e4e4e7; --primary:#18181b; --primary-fg:#fafafa;
  --ring:#a1a1aa; --sidebar:#fafafa; --hover:#f4f4f5; --overlay:rgba(9,9,11,.45);
  --c1:#2a9d90; --c2:#e76e50; --c3:#3b6b8a; --c4:#d9a93a; --c5:#a1a1aa;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --shadow:0 1px 2px rgba(9,9,11,.06);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090b; --fg:#fafafa; --card:#0c0c0e; --muted:#18181b; --muted-fg:#a1a1aa;
  --border:#27272a; --input:#27272a; --primary:#fafafa; --primary-fg:#18181b;
  --ring:#52525b; --sidebar:#0c0c0e; --hover:#18181b; --overlay:rgba(0,0,0,.6);
  --c1:#34c3b3; --c2:#f08a6c; --c3:#6fa3c7; --c4:#e8c468; --c5:#52525b;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090b; --fg:#fafafa; --card:#0c0c0e; --muted:#18181b; --muted-fg:#a1a1aa;
  --border:#27272a; --input:#27272a; --primary:#fafafa; --primary-fg:#18181b;
  --ring:#52525b; --sidebar:#0c0c0e; --hover:#18181b; --overlay:rgba(0,0,0,.6);
  --c1:#34c3b3; --c2:#f08a6c; --c3:#6fa3c7; --c4:#e8c468; --c5:#52525b;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.brand span{font-size:12px;color:var(--muted-fg)}
.nav-label{font-size:12px;color:var(--muted-fg);padding:12px 8px 4px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:450;cursor:pointer}
.nav a:hover{background:var(--hover)}
.nav a.active{background:var(--muted);font-weight:550}
.nav a .tag{margin-left:auto;font-size:11px;color:var(--muted-fg)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.view-switch{display:grid;grid-template-columns:1fr 1fr;background:var(--muted);border-radius:8px;padding:3px;gap:2px}
.view-switch button{border:0;background:transparent;border-radius:6px;padding:6px 8px;font-size:13px;cursor:pointer;color:var(--muted-fg)}
.view-switch button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:550}
.side-note{font-size:12px;color:var(--muted-fg);padding:0 4px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.crumbs .sep{color:var(--muted-fg)}
.crumbs .cur{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border:1px solid var(--border);background:var(--card);border-radius:8px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--hover)}
.menu-btn{display:none}
.select{height:36px;border:1px solid var(--input);border-radius:8px;background:var(--card);padding:0 10px;cursor:pointer}

.content{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;width:100%}
@media (min-width:901px){.content{padding-left:32px;padding-right:32px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:0;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--muted-fg);max-width:70ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Primitives */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-h p{margin:2px 0 0;font-size:13px;color:var(--muted-fg)}
.card-b{padding:16px 18px 18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-kpi6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1280px){.g-kpi6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.g-kpi6{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:22px}}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e,.g-3{grid-template-columns:minmax(0,1fr)}}

.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted-fg);font-weight:500}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;font-family:var(--font);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted-fg);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-family:var(--mono);font-size:12px;font-weight:500}
.up{color:var(--ok)} .down{color:var(--bad)}

.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.pri:hover{opacity:.9}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:550;border:1px solid transparent;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.b-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.b-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.b-info{color:var(--c3);background:color-mix(in srgb,var(--c3) 14%,transparent)}
.b-mute{color:var(--muted-fg);background:var(--muted)}
.b-out{border-color:var(--border);color:var(--fg);background:transparent}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted-fg);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
.cell-main{font-weight:550}
.cell-sub{font-size:12px;color:var(--muted-fg)}

.bar{height:6px;border-radius:999px;background:var(--muted);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--fg)}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.c1>i{background:var(--c1)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search input{width:100%;height:34px;border:1px solid var(--input);border-radius:8px;background:var(--card);padding:0 10px 0 32px}
.search svg{position:absolute;left:10px;top:9px;color:var(--muted-fg)}
.chip{height:30px;padding:0 10px;border:1px dashed var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-style:solid;background:var(--muted);font-weight:550}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--border);font-size:13px;color:var(--muted-fg);gap:8px;flex-wrap:wrap}

.alert-list{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);align-items:start}
.alert:last-child{border-bottom:0}
.alert svg{margin-top:2px}
.alert .t{font-weight:550}
.alert .d{font-size:13px;color:var(--muted-fg)}
.sev-bad{color:var(--bad)} .sev-warn{color:var(--warn)} .sev-info{color:var(--c3)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted-fg)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.chart text{fill:var(--muted-fg);font-family:var(--mono);font-size:11px}
.chart .grid-l{stroke:var(--border);stroke-dasharray:3 3}

.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--muted)}
.stack i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted-fg)}

.pauta{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.pauta li::marker{color:var(--muted-fg);font-family:var(--mono)}

/* Sprint */
.cap-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cap-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cap{border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.cap .l{font-size:12px;color:var(--muted-fg)}
.cap .v{font-size:20px;font-weight:650}
.urgent{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--border));background:color-mix(in srgb,var(--bad) 5%,var(--card));border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.urgent-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.reco{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.reco.top{border-color:var(--fg)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600}
.score-bars{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--muted);margin-top:6px;max-width:260px}
.score-bars i{display:block;height:100%}
.score{font-family:var(--mono);font-size:18px;font-weight:600;text-align:right}
.realloc{border:1px dashed var(--warn);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--warn) 6%,transparent)}

/* Matriz */
.matrix td,.matrix th{padding:6px;text-align:center;border-bottom:1px solid var(--border)}
.matrix th.rot{font-size:11.5px}
.matrix td.name{text-align:left;font-weight:550;white-space:nowrap}
.lv{width:30px;height:26px;border-radius:6px;display:grid;place-items:center;margin:auto;font-family:var(--mono);font-size:12px;font-weight:600}
.lv0{background:transparent;color:var(--border)}
.lv1{background:color-mix(in srgb,var(--c1) 14%,transparent);color:var(--fg)}
.lv2{background:color-mix(in srgb,var(--c1) 32%,transparent);color:var(--fg)}
.lv3{background:color-mix(in srgb,var(--c1) 62%,transparent);color:var(--fg)}
.lv4{background:var(--c1);color:var(--bg)}
.cov-bad{color:var(--bad);font-weight:650}
.cov-warn{color:var(--warn);font-weight:650}

/* Governança */
.rite{display:flex;flex-direction:column;gap:10px}
.rite .freq{font-family:var(--mono);font-size:12px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.06em}
.rite h4{margin:0;font-size:16px}
.sentence{font-size:13.5px;line-height:1.6;border-left:2px solid var(--border);padding-left:12px;color:var(--muted-fg)}
.sentence b{color:var(--fg);font-weight:550}
.auto-col{display:flex;flex-direction:column;gap:8px}
.auto-col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

/* Capacidade */
.seg{display:inline-grid;grid-auto-flow:column;background:var(--muted);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--muted-fg);font-weight:500}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.range-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.range-row input[type=range]{flex:1 1 180px;accent-color:var(--fg)}
.prem input{width:76px;height:30px;border:1px solid var(--input);border-radius:6px;background:var(--card);padding:0 8px;text-align:right;font-family:var(--mono)}
.big{font-size:32px;font-weight:650;letter-spacing:-.02em}

/* Sheet & modal */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:50}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--border);z-index:51;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet-h h2{margin:0;font-size:18px}
.sheet-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.sheet-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:12px;z-index:51;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:550}
.field select,.field textarea,.field input{border:1px solid var(--input);border-radius:8px;background:var(--card);padding:8px 10px}
.field textarea{min-height:72px;resize:vertical}
.ro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--muted);border-radius:8px;padding:10px 12px}
.ro div{font-size:12px;color:var(--muted-fg)}
.ro b{display:block;font-size:13.5px;color:var(--fg);font-weight:550}
.note{font-size:12.5px;color:var(--muted-fg);display:flex;gap:8px;align-items:flex-start}
.warnbox{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--fg);font-size:13px}
.warnbox svg{color:var(--warn);margin-top:2px}
.report{border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.report ul{margin:0;padding-left:18px}

.toast{position:fixed;right:max(16px,calc(16px + env(safe-area-inset-right,0px)));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--primary);color:var(--primary-fg);padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;max-width:min(420px,calc(100% - 32px));font-size:13.5px;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.empty{padding:28px;text-align:center;color:var(--muted-fg);font-size:13.5px}
.ex-tag{font-family:var(--mono);font-size:11px;color:var(--muted-fg);border:1px solid var(--border);border-radius:6px;padding:2px 6px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:55;transform:translateX(-105%);transition:transform .2s ease;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  body.nav-open .sidebar{transform:none}
  body.nav-open .nav-scrim{display:block}
  .menu-btn{display:grid}
  .hide-sm{display:none}
}
.g-q{display:grid;gap:16px;grid-template-columns:minmax(0,2.2fr) minmax(300px,1fr)}
.g-q>.card{height:600px;display:flex;flex-direction:column}
.g-q>.card>.card-b{flex:1;min-height:0}
.g-q .chart-b svg{width:100%;height:100%;display:block}
.g-q .list-b{overflow-y:auto}
.back{display:inline-flex;align-items:center;gap:8px}
.kcol.over{outline:2px dashed var(--ring);outline-offset:-2px}
.kcard[draggable=true]{cursor:grab}
.kcard.dragging{opacity:.4}
@media (max-width:1100px){.g-q{grid-template-columns:minmax(0,1fr)}.g-q>.card{height:520px}}
.qrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--border)}
.qrow:last-child{border-bottom:0}
.qrow:hover,.qrow.hl{background:var(--hover)}
.qrow .rk{font-family:var(--mono);font-size:12px;color:var(--muted-fg)}
.qsum{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--border)}
.qsum:last-child{border-bottom:0}
.qsum:hover{background:var(--hover)}
.qsum i{width:12px;height:12px;border-radius:3px;display:block}
circle.hl{stroke-width:3.5;fill-opacity:1}
.tabs{display:inline-grid;grid-auto-flow:column;background:var(--muted);border-radius:8px;padding:3px;gap:2px}

function monthCalc(m){

    const rev=contractV+excRev;
    const work=h*c.cph, dedH=directedH(c,m), ded=dedH*costHour('Pleno');
    const direct=work+ded, rateio=work*(factor-1), cost=direct+rateio;
    const margin=(rev-cost)/rev, use=h/c.pool;
    return {c,h,rev,contractV,work,ded,dedH,direct,rateio,cost,mr:rev-cost,margin,use,exc,excLeak:c.fat?0:exc,quad:quadOf(margin,use)};
  });
  const H=rows.reduce((s,r)=>s+r.h,0), pool=act.reduce((s,c)=>s+c.pool,0), rev=rows.reduce((s,r)=>s+r.rev,0);

  const leak=rows.reduce((s,r)=>s+r.excLeak,0);
  return {m,rows,H,pool,rev,cost:OP_COST,margin:(rev-OP_COST)/rev,occ:cli/ponto,ponto,cli,int,inv:ponto-cli-int,factor,leak,leakR:leak*S.price*1.3};
}
function avgCost(c,m){const v=[];for(let k=Math.max(0,m-2);k<=m;k++){const r=monthCalc(k).rows.find(x=>x.c===c);if(r)v.push(r.cost);}return v.reduce((a,b)=>a+b,0)/v.length;}
function focal(c){
  const ents=Object.entries(c.att).sort((a,b)=>b[1]-a[1]);const tit=P[ents[0][0]];
  const res=ents.slice(1).map(e=>P[e[0]]).find(p=>(p.sk[c.st]||0)>=3)||PEOPLE.find(p=>p!==tit&&(p.sk[c.st]||0)>=3)||null;
  return {tit,res,risk:(tit.sk[c.st]||0)<3||!res};
}
const shortName=n=>n.split(' ').filter(w=>w!=='&'&&w!=='de').slice(0,2).join(' ');
const projOf=n=>{const c=CLIENTS.find(x=>x.n===n);return c?'Sustentação '+c.st:'Sustentação';};
function quadOf(mg,use){
  const hi=use>1, ok=mg>=0.15;
  if(ok&&!hi) return 'Proteger';
  if(ok&&hi) return 'Otimizar';
  if(!ok&&hi) return 'Reprecificar';
  return 'Revisar escopo';
}
const QUAD={
  'Proteger':{cls:'b-ok',col:'--ok',d:'Margem boa e pool sob controle'},
  'Otimizar':{cls:'b-info',col:'--c3',d:'Margem boa, mas estoura o pool: padronizar e automatizar'},
  'Reprecificar':{cls:'b-bad',col:'--bad',d:'Consome muito e paga pouco: renegociar contrato'},
  'Revisar escopo':{cls:'b-warn',col:'--warn',d:'Margem baixa dentro do pool: rever quem atende e o que o contrato cobre'}
};
function negStreak(c,m){let n=0;for(let k=m;k>=0;k--){const r=monthCalc(k).rows.find(x=>x.c===c);if(r&&r.margin<0)n++;else break;}return n;}
function coverage(st){return PEOPLE.filter(p=>(p.sk[st]||0)>=3).length;}
function clientsByStack(st){return CLIENTS.filter(c=>c.st===st);}

function alerts(m){
  const mc=monthCalc(m), out=[];
  mc.rows.filter(r=>r.margin<0).forEach(r=>{
    const n=negStreak(r.c,m);
    out.push({sev:'bad',t:`${r.c.n}: margem de ${pct(r.margin)}`,d:n>=2?`Negativa há ${n} meses seguidos. Pela regra, entra na pauta de reprecificação.`:'Primeiro mês negativo. Acompanhar no próximo fechamento.',act:{k:'client',id:r.c.id}});
  });
  const leak=mc.rows.filter(r=>r.excLeak>0);
  if(leak.length) out.push({sev:'warn',t:`${hh(mc.leak)} acima do pool sem faturamento`,d:`${leak.map(r=>r.c.n).join(', ')}. Valor não cobrado: ${brl(mc.leak*S.price*1.3)}.`,act:{k:'page',p:'clients'}});
  const zero=STACKS.filter(st=>clientsByStack(st).length&&coverage(st)===0);
  const one=STACKS.filter(st=>clientsByStack(st).length&&coverage(st)===1);
  if(zero.length) out.push({sev:'bad',t:`${zero.join(' e ')}: ninguém com nível 3 ou 4`,d:`${zero.reduce((s,st)=>s+clientsByStack(st).length,0)} clientes dependem de stacks que ninguém domina. Só 1 pessoa cobre ${one.join(', ')}.`,act:{k:'page',p:'team'}});
  const over=PEOPLE.filter(p=>pCli(p,m)/p.ponto>0.9);
  if(over.length) out.push({sev:'warn',t:`${over.length} pessoa${over.length>1?'s':''} acima de 90% de ocupação`,d:S.view==='gestor'?`${over.map(p=>p.n).join(', ')}. Redistribuir na próxima sprint.`:'Detalhe disponível na visão do gestor.',act:{k:'page',p:'team'}});
  const order={bad:0,warn:1,info:2};
  return out.sort((a,b)=>order[a.sev]-order[b.sev]);
}

/* ---------- Gráficos (SVG) ---------- */
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function chartHours(m){
  const W=820,H=250,L=48,R=12,T=14,B=28;
  const data=MS.map((_,k)=>{const mc=monthCalc(k);return {h:mc.H,pool:mc.pool};});
  const max=niceMax(Math.max(...data.map(d=>Math.max(d.h,d.pool)))*1.05);
  const y=v=>T+(H-T-B)*(1-v/max), bw=(W-L-R)/data.length;
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${nf0.format(v)}</text>`;}
  data.forEach((d,k)=>{
    const x=L+bw*k+bw*0.22, w=bw*0.56, sel=k===m;
    g+=`<rect x="${x}" y="${y(d.h)}" width="${w}" height="${y(0)-y(d.h)}" rx="4" fill="var(--c1)" opacity="${sel?1:0.45}"><title>${MONTHS[k]}: ${hh(d.h)} consumidas de ${hh(d.pool)} contratadas</title></rect>`;
    g+=`<text x="${L+bw*k+bw/2}" y="${H-8}" text-anchor="middle" style="${sel?'fill:var(--fg);font-weight:600':''}">${MS[k]}</text>`;
  });
  const pts=data.map((d,k)=>`${L+bw*k+bw/2},${y(d.pool)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 4"/>`;
  data.forEach((d,k)=>g+=`<circle cx="${L+bw*k+bw/2}" cy="${y(d.pool)}" r="${k===m?4.5:3}" fill="var(--bg)" stroke="var(--fg)" stroke-width="2"/>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Horas consumidas por mês comparadas ao pool contratado">${g}</svg>`;
}
function stepFor(span){return [0.05,0.1,0.25,0.5,1].find(s=>span/s<=6)||1;}
function chartQuadrant(rows){
  const W=900,H=520,L=56,R=18,T=16,B=46,q=S.quadSel;
  const pts=q?rows.filter(r=>r.quad===q):rows;
  const WIN={'Proteger':[0,1,0.15,0.75],'Otimizar':[1,2,0.15,0.75],'Reprecificar':[1,2,-0.6,0.15],'Revisar escopo':[0,1,-0.6,0.15]};
  const [x0,x1,y0,y1]=q?WIN[q]:[0,2,-0.6,0.75];   // escala fixa: zoom = recorte do mesmo plano
  const X=v=>L+(W-L-R)*(Math.min(v,2)-x0)/(x1-x0), Y=v=>T+(H-T-B)*(y1-v)/(y1-y0);
  const cx=v=>Math.max(L,Math.min(W-R,X(v))), cy=v=>Math.max(T,Math.min(H-B,Y(v)));
  let g='';
  const qx=cx(1),qy=cy(0.15);
  const bg=(xa,ya,xb,yb,col,qq)=>{const w=xb-xa,h=yb-ya;return w>0.5&&h>0.5?`<rect x="${xa}" y="${ya}" width="${w}" height="${h}" fill="var(${col})" opacity="${q&&q!==qq?0.02:0.07}" data-act="qsel" data-q="${qq}" style="cursor:pointer"><title>Ampliar ${qq}</title></rect>`:'';};
  g+=bg(L,T,qx,qy,'--ok','Proteger')+bg(qx,T,W-R,qy,'--c3','Otimizar')+bg(qx,qy,W-R,H-B,'--bad','Reprecificar')+bg(L,qy,qx,H-B,'--warn','Revisar escopo');
  const ys=stepFor(y1-y0);for(let v=Math.ceil(y0/ys)*ys;v<=y1+1e-9;v+=ys){g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${nf0.format(v*100)}%</text>`;}
  const xs=stepFor(x1-x0);for(let v=Math.ceil(x0/xs)*xs;v<=x1+1e-9;v+=xs){g+=`<text x="${X(v)}" y="${H-B+16}" text-anchor="middle">${nf0.format(v*100)}%</text>`;}
  if(x0<1&&x1>1) g+=`<line x1="${X(1)}" x2="${X(1)}" y1="${T}" y2="${H-B}" stroke="var(--muted-fg)"/>`;
  if(y0<0.15&&y1>0.15) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0.15)}" y2="${Y(0.15)}" stroke="var(--muted-fg)"/>`;
  if(!q){
    g+=`<text x="${L+8}" y="${T+16}" style="fill:var(--ok);font-weight:600">PROTEGER</text>`;
    g+=`<text x="${W-R-8}" y="${T+16}" text-anchor="end" style="fill:var(--c3);font-weight:600">OTIMIZAR</text>`;
    g+=`<text x="${W-R-8}" y="${qy+18}" text-anchor="end" style="fill:var(--bad);font-weight:600">REPRECIFICAR</text>`;
    g+=`<text x="${L+8}" y="${qy+18}" style="fill:var(--warn);font-weight:600">REVISAR ESCOPO</text>`;
  }
  g+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle">consumo do pool (horas usadas ÷ contratadas)</text>`;
  const maxMr=Math.max(...rows.map(r=>r.mr));
  const lab=q?(pts.length<=6?pts:pts.slice().sort((a,b)=>b.mr-a.mr).slice(0,6)):rows.filter(r=>r.margin<0);
  const placed=[];
  pts.slice().sort((a,b)=>b.mr-a.mr).forEach(r=>{
    const col=QUAD[r.quad].col, rad=r.mr>0?3+7*Math.sqrt(r.mr/maxMr):4, xx=Math.min(W-R-8,X(r.use)), off=r.margin<y0, yy=off?H-B-8:Y(r.margin);
    g+=`<circle data-act="client" data-id="${r.c.id}" data-hl="${r.c.id}" cx="${xx}" cy="${yy}" r="${rad}" fill="var(${col})" fill-opacity=".55" stroke="var(${col})" stroke-width="1.2" ${r.mr<0?'stroke-dasharray="3 2"':''} style="cursor:pointer"><title>${esc(r.c.n)} · margem ${pct(r.margin)} (${brl(r.mr)}) · pool ${pct(r.use)}</title></circle>`;
    if(lab.includes(r)||off){
      const txt=shortName(r.c.n)+(off?` (${pct(r.margin)} ↓)`:''), tw=txt.length*6.6;
      let lx=xx+rad+4, ly=yy+4; if(lx+tw>W-R) lx=xx-rad-4-tw;
      if(!placed.some(p=>Math.abs(p.y-ly)<13&&lx<p.x+p.w&&lx+tw>p.x)){placed.push({x:lx,y:ly,w:tw});g+=`<text x="${lx}" y="${ly}" style="fill:var(--fg)">${esc(txt)}</text>`;}
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa da carteira: margem por consumo do pool">${g}</svg>`;
}
const QSORT={
  'Proteger':{f:(a,b)=>b.mr-a.mr,d:'maior contribuição em R$ primeiro'},
  'Otimizar':{f:(a,b)=>b.exc-a.exc,d:'mais horas acima do pool primeiro'},
  'Reprecificar':{f:(a,b)=>a.margin-b.margin,d:'pior margem primeiro'},
  'Revisar escopo':{f:(a,b)=>a.margin-b.margin,d:'pior margem primeiro'}
};
function quadList(rows){

    <p class="note" style="margin:10px 0 0">${ic('info')}<span>Valor à direita: margem do quadrante em R$ no mês.</span></p></div>`;

  <div class="card-b list-b" style="padding-top:8px">${list.map((r,k)=>`<div class="qrow" data-act="client" data-id="${r.c.id}" data-hl="${r.c.id}"><span class="rk">${k+1}</span><div style="min-width:0"><div class="cell-main" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.c.n)}</div><div class="cell-sub">${esc(r.c.st)} · pool ${pct(r.use)}${r.exc?` · +${hh(r.exc)}`:''}</div></div><div style="text-align:right"><div class="num" style="font-size:13px;color:${r.mr<0?'var(--bad)':'var(--fg)'}">${brl(r.mr)}</div><div class="cell-sub num">${pct(r.margin)}</div></div></div>`).join('')||'<div class="empty">Nenhum cliente neste quadrante.</div>'}</div>`;
}
function sparkMargin(c){
  const W=260,H=64,P2=6;
  const vals=MS.map((_,k)=>{const r=monthCalc(k).rows.find(x=>x.c===c);return r?r.margin:null;});
  const v=vals.filter(x=>x!==null),mn=Math.min(0,...v)-0.05,mx=Math.max(0.1,...v)+0.05;
  const x=k=>P2+(W-2*P2)*k/5, y=val=>P2+(H-2*P2)*(mx-val)/(mx-mn);
  let pts=[],g=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" class="grid-l"/>`;
  vals.forEach((val,k)=>{if(val!==null)pts.push([x(k),y(val),val]);});
  g+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="2"/>`;
  pts.forEach((p,k)=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${k===pts.length-1?4:2.5}" fill="${p[2]<0?'var(--bad)':'var(--fg)'}"/>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Margem nos últimos meses">${g}</svg>`;
}
function chartUrg(){
  const W=420,H=150,L=30,R=8,T=10,B=22,max=50;
  const y=v=>T+(H-T-B)*(1-v/max), bw=(W-L-R)/URG_HIST.length, mu=mean(URG_HIST);
  let g='';
  [0,25,50].forEach(v=>g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  URG_HIST.forEach((v,k)=>{g+=`<rect x="${L+bw*k+bw*.2}" y="${y(v)}" width="${bw*.6}" height="${y(0)-y(v)}" rx="3" fill="var(--c2)" opacity=".7"><title>Sprint ${34+k}: ${v} h urgentes</title></rect><text x="${L+bw*k+bw/2}" y="${H-6}" text-anchor="middle">S${34+k}</text>`;});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(mu)}" y2="${y(mu)}" stroke="var(--muted-fg)" stroke-dasharray="4 3"/><line x1="${L}" x2="${W-R}" y1="${y(BUF)}" y2="${y(BUF)}" stroke="var(--fg)" stroke-width="1.5"/>`;
  g+=`<text x="${W-R}" y="${y(BUF)-5}" text-anchor="end" style="fill:var(--fg)">buffer ${BUF} h</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Horas urgentes por sprint">${g}</svg>`;
}
function chartPayback(cum){
  const W=520,H=190,L=56,R=10,T=12,B=26;
  const mn=Math.min(...cum),mx=Math.max(...cum);
  const lo=-niceMax(-mn*1.1||1),hi=niceMax(mx*1.05||1);
  const x=k=>L+(W-L-R)*k/(cum.length-1), y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let g='';
  [lo,0,hi/2,hi].forEach(v=>g+=`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${nf0.format(v/1000)}k</text>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted-fg)"/>`;
  const pts=cum.map((v,k)=>`${x(k)},${y(v)}`).join(' ');
  g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(cum.length-1)},${y(0)}" fill="var(--c1)" opacity=".12"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="var(--c1)" stroke-width="2.5"/>`;
  cum.forEach((v,k)=>{if(k%3===0||k===cum.length-1)g+=`<text x="${x(k)}" y="${H-6}" text-anchor="middle">m${k}</text>`;});
  g+=`<circle cx="${x(cum.length-1)}" cy="${y(cum[cum.length-1])}" r="4" fill="var(--c1)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Resultado acumulado em 12 meses">${g}</svg>`;
}

/* ---------- Componentes ---------- */
const kpi=(lbl,val,sub,icon)=>`<div class="card kpi"><div class="lbl"><span>${lbl}</span>${icon?ic(icon,'muted'):''}</div><div class="val">${val}</div><div class="sub">${sub||''}</div></div>`;
function delta(cur,prev,good='up',fmt=v=>pct1(v)){
  const d=cur-prev; if(Math.abs(d)<1e-9) return '<span class="delta muted">0</span>';
  const up=d>0, cls=(up===(good==='up'))?'up':'down';
  return `<span class="delta ${cls}">${up?'▲':'▼'} ${fmt(Math.abs(d))}</span>`;
}
const qBadge=q=>`<span class="badge ${QUAD[q].cls}"><span class="dot"></span>${q}</span>`;
function marginBadge(mg){const c=mg<0?'b-bad':mg<0.15?'b-warn':'b-ok';return `<span class="badge ${c} num">${pct(mg)}</span>`;}
function useBar(u){const c=u>1?'bad':u>=0.9?'warn':'ok';return `<div style="display:flex;align-items:center;gap:8px"><div class="bar ${c}" style="flex:1"><i style="width:${Math.min(100,u*100)}%"></i></div><span class="num" style="font-size:12px;width:40px;text-align:right">${pct(u)}</span></div>`;}

function kanbanItems(mc){return mc.rows.filter(r=>r.margin<0.15||S.kstage[r.c.id]).map(r=>({r,st:S.kstage[r.c.id]||'alerta'}));}

      <div class="row"><span class="cell-sub">${esc(r.c.st)} · contrato ${brl(r.contractV)} · mín. ${brl(avgCost(r.c,S.month)/0.85)}</span></div>
      <div class="row">${qBadge(r.quad)}${ix<3?`<button type="button" class="btn sm" data-act="kadv" data-id="${r.c.id}">${KST[ix+1][1].split(' ')[0]==='Na'?'Levar à pauta':KST[ix+1][1]} ${ic('right')}</button>`:''}</div>

}

function clientTable(all){

  if(S.pageN>=pages) S.pageN=pages-1;
  const slice=rows.slice(S.pageN*per,S.pageN*per+per);
  const satB=v=>`<span class="badge ${v<4?'b-warn':'b-mute'} num">${nf1.format(v)}</span>`;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Cliente</th><th style="min-width:150px">Pool usado</th><th class="r">Receita</th><th class="r">Custo</th><th class="r">Margem</th><th class="r">Satisfação</th><th>Ação sugerida</th></tr></thead>

      <td class="r">${marginBadge(r.margin)}</td><td class="r">${satB(r.c.sat)}</td><td>${qBadge(r.quad)}</td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">Nenhum cliente encontrado.</div></td></tr>`}</tbody></table></div>
    <div class="pager"><span>${rows.length} clientes · página ${S.pageN+1} de ${pages}</span><div style="display:flex;gap:6px"><button type="button" class="btn sm" data-act="pg" data-d="-1" ${S.pageN===0?'disabled':''}>${ic('left')} Anterior</button><button type="button" class="btn sm" data-act="pg" data-d="1" ${S.pageN>=pages-1?'disabled':''}>Próxima ${ic('right')}</button></div></div>`;
}

function score(p,u){
  const lvl=p.sk[u.st]||0;
  const folgaMax=Math.max(...PEOPLE.map(x=>Math.max(0,35-S.load[x.id])));
  const folga=Math.max(0,35-S.load[p.id]);
  const cli=CLIENTS.find(c=>c.n===u.cli), share=cli&&cli.att[p.id]?cli.att[p.id]:0;
  const a=lvl/4*50, b=folgaMax?folga/folgaMax*30:0, c=share?10+10*share:0;
  return {p,lvl,folga,share,a,b,c,t:a+b+c};
}
function pgSprint(){
  const u=URGENT[S.urgIdx]||null;
  const used=PEOPLE.reduce((s,p)=>s+S.load[p.id],0);
  const bufLeft=BUF-S.bufUsed;
  let urgent='';
  if(u){
    const ranked=PEOPLE.map(p=>score(p,u)).filter(x=>x.lvl>0).sort((a,b)=>b.t-a.t).slice(0,3);
    const cov=coverage(u.st);
    urgent=`<div class="urgent">
      <div class="urgent-h"><div><span class="badge b-bad"><span class="dot"></span>Urgente</span> <span class="muted mono" style="font-size:12px;margin-left:6px">GLPI #${u.id}</span>
        <h3 style="margin:8px 0 2px;font-size:16px">${esc(u.t)}</h3><div class="muted" style="font-size:13px">${esc(u.cli)} · ${u.st} · estimativa ${u.h} h</div></div>
        <div class="muted" style="font-size:13px;text-align:right">Buffer restante<br><b class="num" style="font-size:18px;color:${bufLeft<u.h?'var(--bad)':'var(--fg)'}">${bufLeft} h</b></div></div>
      ${cov<2?`<div class="warnbox">${ic('alert')}<div>${cov===0?'Ninguém tem':'Só 1 pessoa tem'} nível 3 ou 4 em ${u.st}. A sugestão abaixo é a melhor disponível, não a ideal. Isso também aparece na página Equipe.</div></div>`:''}
      <div style="display:flex;flex-direction:column;gap:8px">
      ${ranked.map((r,k)=>`<div class="reco ${k===0?'top':''}">
        <div class="avatar">${initials(r.p.n)}</div>
        <div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${r.p.n}</b><span class="muted" style="font-size:12px">${r.p.lv} · ${u.st} nível ${r.lvl} · folga ${r.folga} h${r.share?' · já atende o cliente':''}</span></div>
          <div class="score-bars" title="Stack ${nf0.format(r.a)} · Folga ${nf0.format(r.b)} · Relação ${nf0.format(r.c)}"><i style="width:${r.a}%;background:var(--c1)"></i><i style="width:${r.b}%;background:var(--c3)"></i><i style="width:${r.c}%;background:var(--c4)"></i></div></div>
        <div style="display:flex;align-items:center;gap:10px"><span class="score">${nf0.format(r.t)}</span><button type="button" class="btn sm ${k===0?'pri':''}" data-act="assign" data-p="${r.p.id}">${k===0?'Aprovar':'Escolher'}</button></div>
      </div>`).join('')}
      </div>
      <div class="legend"><span><i style="background:var(--c1)"></i>Stack (até 50)</span><span><i style="background:var(--c3)"></i>Folga na sprint (até 30)</span><span><i style="background:var(--c4)"></i>Já atende o cliente (até 20)</span></div>
      ${S.realloc?`<div class="realloc"><div style="display:flex;gap:8px">${ic('alert','sev-warn')}<div><b>Buffer insuficiente.</b> Faltam ${S.realloc.need} h. Sugestão: mover <b>#${S.realloc.task.id} ${esc(S.realloc.task.t)}</b> (${esc(S.realloc.task.cli)}, ${S.realloc.task.h} h, prioridade baixa) para a Sprint 43.</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm pri" data-act="realloc-ok">${ic('move')} Aprovar realocação</button><button type="button" class="btn sm" data-act="realloc-no">Manter e estourar a sprint</button></div></div>`:''}
    </div>`;
  } else {
    urgent=`<div class="card"><div class="empty">Sem urgências na fila. <button type="button" class="btn sm" data-act="reset-urg" style="margin-left:8px">Reiniciar simulação</button></div></div>`;
  }
  const st=s=>({'A fazer':'b-mute','Em andamento':'b-info','Validação':'b-warn','Concluído':'b-ok'}[s]);
  return `
  <div class="page-head"><div><h1>Sprint e alocação</h1><p>Sprint 42 · 13 a 17 de outubro. Urgências entram no buffer reservado; quando ele acaba, o painel sugere o que adiar.</p></div>

    <div class="cap"><div class="l">Alocado agora</div><div class="v num">${used} h</div><div class="cell-sub">${pct(used/SPRINT_CAP)} da capacidade</div></div>
  </div></div></div>

  <div class="grid g-2">
    ${urgent}
    <div class="card">
      <div class="card-h"><div><h3>Como o buffer é calculado</h3><p>Média das horas urgentes nas últimas 8 sprints + 1 desvio-padrão.</p></div></div>

    </div>
  </div>

  <div class="card">
    <div class="card-h"><div><h3>Itens da sprint</h3><p>Amostra de ${S.tasks.length} itens. Ao encerrar uma task, a IA gera o relatório dela e o próprio analista aprova.</p></div></div>
    <div class="card-b" style="padding:8px 6px 6px"><div class="tbl-wrap"><table>
      <thead><tr><th>Chamado</th><th>Cliente</th><th>Stack</th><th>Responsável</th><th class="r">Horas</th><th>Status</th><th></th></tr></thead>

        <td><span class="badge ${st(t.s)}"><span class="dot"></span>${t.s}</span></td>
        <td class="r">${(t.s==='Em andamento'||t.s==='Validação')&&!t.moved?`<button type="button" class="btn sm" data-act="close" data-id="${t.id}">Encerrar task</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
  </div>`;

function roiCalc(){
  const pr=S.prem[S.scen], H=1400, nCli=30, ch=OP_COST/H;
  const rel=pr.rel*nCli*pr.auto/100, tri=H*pr.tri/100*pr.triR/100, ret=H*pr.ret/100*pr.retR/100;
  const freed=rel+tri+ret;
  const impl=170*ch, maint=20*ch+60;
  const monthly=freed*ch-maint;
  const pay=monthly>0?impl/monthly:Infinity;
  const extra=freed/(H/nCli);
  const cum=[];let acc=0;for(let k=0;k<=12;k++){if(k===0){acc=0;}else if(k<=3){acc-=impl/3;}else{acc+=monthly;}cum.push(acc);}
  return {rel,tri,ret,freed,impl,maint,monthly,pay,extra,ch,cum,revPot:extra*(H/nCli)*S.price*12};
}

function isGeneric(t){t=(t||'').trim();return !t||t.length<25||/problema relatado/i.test(t);}
function aiMerge(r,note){
  const n=(note||'').trim(); if(!n) return 'empty';
  const norm=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>3);
  const have=new Set(norm((r.desc||'')+' '+(r.chg||''))), words=norm(n), novel=words.filter(w=>!have.has(w));
  if(words.length&&novel.length/words.length<0.34) return 'dup';
  let t=n.charAt(0).toUpperCase()+n.slice(1); if(!/[.!?]$/.test(t)) t+='.';
  r.desc=((r.desc||'').trim()?(r.desc.trim()+' '):'')+t; r.aiAdded=t; return 'added';
}

  const doc=`<div class="report doc">
      <div class="doc-h"><b>Relatório da task #${r.tid} · ${esc(r.t)}</b>${!ro&&!ed?`<button type="button" class="linkbtn" data-act="redit">Editar manualmente</button>`:''}</div>
      <div class="doc-meta"><span>Cliente: ${esc(r.cli)}</span><span>Projeto: ${esc(r.proj)}</span><span>Analista: ${P[r.p].n}</span><span class="num">${r.h} h</span><span>${esc(r.ty||'—')} · ${esc(r.st)}</span></div>
      <div><div class="doc-l">O que foi feito</div><p>${descHTML}</p></div>
      <div><div class="doc-l">O que muda para o cliente</div><p>${r.chg?esc(r.chg):'<span class="muted">Não informado.</span>'}</p></div>
    </div>`;
  const edit=`<div class="field"><label for="f-type">Tipo de trabalho</label><select id="f-type"><option value="">Selecione</option>${TYPES.map(x=>`<option ${x[0]===r.ty?'selected':''}>${x[0]}</option>`).join('')}</select></div>
      <div class="field"><label for="f-stack">Stack usada</label><select id="f-stack">${STACKS.map(x=>`<option ${x===r.st?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="f-desc">O que foi feito</label><textarea id="f-desc">${esc(r.desc||'')}</textarea></div>
      <div class="field"><label for="f-chg">O que muda para o cliente</label><textarea id="f-chg">${esc(r.chg||'')}</textarea></div>`;
  return `<div class="scrim" data-act="close-layer"></div>
  <div class="modal" role="dialog" aria-label="Relatório da task">
    <div class="sheet-h"><div><h2>Relatório da task</h2><div style="margin-top:8px"><span class="badge ${RST[r.status][0]}"><span class="dot"></span>${RST[r.status][1]}</span>${r.aiAdded&&!ro?' <span class="badge b-info">Atualizado pela IA</span>':''}</div></div><button type="button" class="icon-btn" data-act="close-layer" aria-label="Fechar">${ic('x')}</button></div>
    <div class="sheet-b">
      ${r.h>r.open?`<div class="warnbox">${ic('alert')}<div>No GLPI: ${r.h} h apontadas, mas o chamado ficou aberto ${r.open} h úteis. Confira as horas.</div></div>`:''}
      ${ed?edit:doc}
      ${ro?'':`<div class="field"><label for="f-note">Faltou algo?</label><textarea id="f-note" placeholder="Escreva só o que faltou. Ex.: também ajustei o filtro por categoria."></textarea>
        <p class="note" style="margin:0">${ic('spark')}<span>A IA compara com o relatório e incorpora só o que ainda não estiver nele.</span></p></div>`}
    </div>
    <div class="sheet-f">${ro?`<button type="button" class="btn" data-act="close-layer">Fechar</button>`:`<button type="button" class="btn" data-act="rsave">Aprovar depois</button><button type="button" class="btn" data-act="rfix">${ic('spark')} Corrigir com IA</button><button type="button" class="btn pri" data-act="rapprove">${ic('check')} Aprovar relatório</button>`}</div>
  </div>`;
}
function modalAdd(){
  const avail=S.tasks.filter(t=>!t.moved&&!S.reports.some(r=>r.tid===t.id));
  const t=avail.find(x=>x.id===S.addSel);
  return `<div class="scrim" data-act="close-layer"></div>
  <div class="modal" role="dialog" aria-label="Adicionar relatório">
    <div class="sheet-h"><div><h2>Adicionar relatório</h2><div class="muted" style="font-size:13px;margin-top:4px">Escolha a task. Chamado, cliente e projeto vêm junto.</div></div><button type="button" class="icon-btn" data-act="close-layer" aria-label="Fechar">${ic('x')}</button></div>
    <div class="sheet-b">
      <div class="field"><label for="f-task">Task</label><select id="f-task"><option value="">Selecione uma task</option>${avail.map(x=>`<option value="${x.id}" ${x.id===S.addSel?'selected':''}>#${x.id} · ${esc(x.t)}</option>`).join('')}</select></div>
      ${t?`<div class="ro"><div>Chamado<b class="mono">#${t.id}</b></div><div>Cliente<b>${esc(t.cli)}</b></div><div>Projeto<b>${esc(projOf(t.cli))}</b></div></div>`:'<p class="note" style="margin:0">'+ic('info')+'<span>Use quando quiser registrar uma task antes de encerrar, ou uma que ficou sem relatório.</span></p>'}
    </div>
    <div class="sheet-f"><button type="button" class="btn" data-act="close-layer">Cancelar</button><button type="button" class="btn pri" data-act="add-go" ${t?'':'disabled'}>${ic('spark')} Gerar rascunho com IA</button></div>
  </div>`;
}
function sheetMonthly(id){
  const m=S.month, r=monthCalc(m).rows.find(x=>x.c.id===id), c=r.c, ms=S.monthly[id], n=Math.max(1,Math.round(r.h/4.5));
  const src=[[c.st,GAINS[c.st]],[c.st,'ajuste em regra de negócio pedido pelo cliente'],[c.st,'correção de erro reportado por usuário']];
  return `<div class="scrim" data-act="close-layer"></div>
  <aside class="sheet" role="dialog" aria-label="Relatório mensal">
    <div class="sheet-h"><div><h2>Relatório mensal</h2><div class="muted" style="font-size:13px;margin-top:4px">${esc(c.n)} · ${MONTHS[m]} · ponto focal ${focal(c).tit.n}</div><div style="margin-top:8px"><span class="badge ${MST[ms]}"><span class="dot"></span>${ms}</span></div></div><button type="button" class="icon-btn" data-act="close-layer" aria-label="Fechar">${ic('x')}</button></div>
    <div class="sheet-b">
      ${reportDraft(c,m,r)}
      <div class="box"><h4>De onde veio</h4><div class="cell-sub" style="margin-bottom:6px">${n} relatórios de task aprovados em ${MONTHS[m].toLowerCase()}. Exemplos:</div>
        ${src.map((x,k)=>`<div class="kv"><span>#4${8100+c.i*7+k} · ${esc(x[1])}</span><span class="badge b-ok">Aprovado</span></div>`).join('')}</div>
      <p class="note" style="margin:0">${ic('info')}<span>A IA só junta o que já foi aprovado task a task. Nada é enviado ao cliente sem a aprovação do ponto focal.</span></p>
    </div>
    <div class="sheet-f"><button type="button" class="btn" data-act="close-layer">Fechar</button><button type="button" class="btn pri" data-act="send-rep" data-id="${id}" ${ms==='Enviado'?'disabled':''}>${ms==='Enviado'?ic('check')+' Enviado':ic('send')+' Aprovar e enviar'}</button></div>
  </aside>`;
}

/* ---------- Render ---------- */
function visiblePages(){return Object.entries(PAGES).filter(([k,v])=>S.view==='gestor'||!v.gestor);}
function renderNav(){
  const groups={};visiblePages().forEach(([k,v])=>{(groups[v.group]=groups[v.group]||[]).push([k,v]);});
  document.getElementById('nav').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="nav-label">${g}</div>${items.map(([k,v])=>`<a data-act="go" data-p="${k}" class="${S.page===k?'active':''}" href="#${k}">${ic(v.icon)}<span>${v.label}</span>${k==='roi'?'<span class="tag">simulador</span>':''}</a>`).join('')}`).join('');
  document.getElementById('crumb').textContent=PAGES[S.page].label;
  document.getElementById('vw-gestor').classList.toggle('on',S.view==='gestor');
  document.getElementById('vw-diretoria').classList.toggle('on',S.view==='diretoria');
}
function render(){
  if(!visiblePages().some(([k])=>k===S.page)) S.page='overview';
  renderNav();
  const fn={overview:pgOverview,clients:pgClients,sprint:pgSprint,reports:pgReports,team:pgTeam,gov:pgGov,roi:pgRoi}[S.page];
  document.getElementById('page').innerHTML=fn();
  renderLayer();
}
function renderLayer(){
  let h='';
  if(S.sheet) h+=sheetClient(S.sheet);
  if(S.msheet) h+=sheetMonthly(S.msheet);
  if(S.add) h+=modalAdd();
  if(S.modal) h+=modalReport(S.modal);
  document.getElementById('layer').innerHTML=h;
}
let toastT;
function toast(msg){const b=document.getElementById('toastbox');b.innerHTML=`<div class="toast" role="status">${ic('check')}<span>${esc(msg)}</span></div>`;clearTimeout(toastT);toastT=setTimeout(()=>{b.innerHTML='';},3200);}
function now(){const d=new Date();return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function log(t,d,k){S.log.push({t,d,k,at:now()});}

/* ---------- Tema ---------- */
const root=document.documentElement;
function getTheme(){try{return localStorage.getItem('pulso-theme')||'system';}catch(e){return 'system';}}
function applyTheme(t){
  if(t==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',t);
  const b=document.getElementById('themeBtn');
  b.innerHTML=ic(t==='dark'?'moon':t==='light'?'sun':'auto');
  b.title='Tema: '+(t==='system'?'sistema':t==='dark'?'escuro':'claro');
}
let theme=getTheme();applyTheme(theme);

/* ---------- Eventos ---------- */
const monthSel=document.getElementById('month');
monthSel.innerHTML=MONTHS.map((n,k)=>`<option value="${k}" ${k===S.month?'selected':''}>${n} 2026</option>`).join('');
monthSel.addEventListener('change',()=>{S.month=+monthSel.value;S.pageN=0;render();});

function closeLayers(){S.sheet=null;S.msheet=null;S.modal=null;S.add=false;S.editing=null;}
function readFields(r){const g=id=>document.getElementById(id);if(!g('f-type'))return;r.ty=g('f-type').value;r.st=g('f-stack').value;r.desc=g('f-desc').value;r.chg=g('f-chg').value;}
const curR=()=>S.reports.find(x=>x.id===S.modal);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='go'){e.preventDefault();S.page=el.dataset.p;closeLayers();document.body.classList.remove('nav-open');render();window.scrollTo(0,0);return;}
  if(a==='open-nav'){document.body.classList.add('nav-open');return;}
  if(a==='close-nav'){document.body.classList.remove('nav-open');return;}
  if(a==='view'){S.view=el.dataset.v;render();return;}
  if(a==='theme'){theme=theme==='system'?'dark':theme==='dark'?'light':'system';try{localStorage.setItem('pulso-theme',theme);}catch(err){}applyTheme(theme);return;}
  if(a==='client'){closeLayers();S.sheet=id;renderLayer();return;}
  if(a==='close-layer'){closeLayers();render();return;}
  if(a==='qsel'){S.quadSel=el.dataset.q||null;render();return;}
  if(a==='ctab'){S.ctab=el.dataset.t;render();return;}
  if(a==='rtab'){S.rtab=el.dataset.t;render();return;}
  if(a==='quad'){S.quad=el.dataset.q;S.pageN=0;render();return;}
  if(a==='pg'){S.pageN+=+el.dataset.d;document.getElementById('ctable').innerHTML=clientTable(monthCalc(S.month).rows.slice().sort((x,y)=>x.margin-y.margin));return;}
  if(a==='scen'){S.scen=el.dataset.s;render();return;}
  if(a==='kadv'){
    const c=CLIENTS.find(x=>x.id===id), cur=S.kstage[id]||'alerta', ix=KST.findIndex(k=>k[0]===cur);
    if(ix>=KST.length-1) return;
    const nx=KST[ix+1]; S.kstage[id]=nx[0];
    const msg={pauta:'Levado à revisão mensal',negociacao:'Em negociação com o comercial',resolvido:'Contrato ajustado'}[nx[0]];
    log(msg,`${c.n} · ${nx[1].toLowerCase()}`,'');render();toast(`${c.n}: ${nx[1].toLowerCase()}.`);return;
  }
  if(a==='send-rep'){const c=CLIENTS.find(x=>x.id===id);S.monthly[id]='Enviado';log(`Relatório de ${MONTHS[S.month].toLowerCase()} enviado`,`${c.n} · aprovado pelo ponto focal`,'');render();toast('Relatório aprovado e enviado ao cliente.');return;}
  if(a==='msheet'){closeLayers();S.msheet=id;if(S.monthly[id]==='Rascunho gerado')S.monthly[id]='Em revisão';render();return;}
  if(a==='next-urg'){if(S.realloc)return;S.urgIdx++;render();return;}
  if(a==='reset-urg'){S.urgIdx=0;S.bufUsed=0;S.realloc=null;S.load=Object.fromEntries(PEOPLE.map(p=>[p.id,p.sprint]));S.tasks=S.tasks.filter(t=>!t.urg).map(t=>({...t,moved:false}));render();return;}
  if(a==='assign'){
    const u=URGENT[S.urgIdx],pid=el.dataset.p,left=BUF-S.bufUsed;
    if(u.h>left&&!S.realloc){
      const cand=S.tasks.find(t=>t.prio==='Baixa'&&t.s==='A fazer'&&!t.moved)||S.tasks.find(t=>t.s==='A fazer'&&!t.moved);
      if(cand){S.realloc={task:cand,need:u.h-left,pid};render();return;}
    }
    doAssign(pid);return;
  }
  if(a==='realloc-ok'){const t=S.realloc.task;t.moved=true;S.bufUsed-=t.h;S.load[t.p]-=t.h;log('Item adiado para a Sprint 43',`#${t.id} ${t.cli} · abre espaço para urgência`,'');const pid=S.realloc.pid;S.realloc=null;doAssign(pid);return;}
  if(a==='realloc-no'){const pid=S.realloc.pid;S.realloc=null;doAssign(pid,true);return;}
  if(a==='close'){const t=S.tasks.find(x=>x.id===+id);t.s='Concluído';const r=makeReport(t,'auto','Pendente');closeLayers();S.modal=r.id;render();return;}
  if(a==='ropen'){closeLayers();S.modal=+id;renderLayer();return;}
  if(a==='redit'){S.editing=S.modal;renderLayer();return;}
  if(a==='rfix'){
    const r=curR();readFields(r);const note=(document.getElementById('f-note')||{}).value;
    const res=aiMerge(r,note);
    if(res==='empty'){toast('Escreva o que faltou antes de pedir a correção.');return;}
    if(res==='dup'){toast('Isso já está no relatório. Nada foi alterado.');return;}
    S.editing=null;renderLayer();toast('A IA incorporou ao relatório. Confira o trecho destacado e aprove.');return;
  }
  if(a==='rsave'){const r=curR();readFields(r);if(r.status==='Rascunho')r.status='Pendente';S.modal=null;S.editing=null;render();toast('Relatório salvo. Aguarda aprovação.');return;}
  if(a==='rapprove'){
    const r=curR();readFields(r);
    if(!r.ty||!(r.chg||'').trim()){S.editing=r.id;renderLayer();toast('Preencha o tipo e o que muda para o cliente antes de aprovar.');return;}
    r.status='Aprovado';r.aiAdded=null;S.editing=null;log('Relatório de task aprovado',`#${r.tid} ${r.cli} · ${P[r.p].n}`,'');S.modal=null;render();toast('Relatório aprovado. Entra no relatório mensal do cliente.');return;
  }
  if(a==='add-open'){closeLayers();S.add=true;S.addSel=null;renderLayer();return;}
  if(a==='add-go'){const t=S.tasks.find(x=>x.id===S.addSel);if(!t)return;const r=makeReport(t,'manual','Rascunho');S.add=false;S.modal=r.id;render();return;}
});
function doAssign(pid,over){
  const u=URGENT[S.urgIdx];
  S.load[pid]+=u.h;S.bufUsed+=u.h;
  S.tasks.unshift({id:u.id,cli:u.cli,t:u.t,st:u.st,p:pid,h:u.h,open:u.h+2,s:'Em andamento',urg:true});
  log('Urgência atribuída',`#${u.id} ${u.cli} → ${P[pid].n}${over?' · sprint estourada':''}`,'');
  S.urgIdx++;render();toast(`#${u.id} atribuído a ${P[pid].n}.`);
}
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S.pageN=0;document.getElementById('ctable').innerHTML=clientTable(monthCalc(S.month).rows.slice().sort((x,y)=>x.margin-y.margin));}
  if(e.target.id==='price-r'){document.getElementById('price-r-v').textContent='R$ '+e.target.value+'/h';}
});
document.addEventListener('change',e=>{
  if(e.target.id==='price-c'||e.target.id==='price-r'){S.price=+e.target.value;render();}
  if(e.target.id==='f-task'){S.addSel=+e.target.value||null;renderLayer();}
  if(e.target.dataset&&e.target.dataset.k){const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=0){S.prem[S.scen][e.target.dataset.k]=v;render();}}
});
function hl(id,on){document.querySelectorAll(`[data-hl="${id}"]`).forEach(n=>n.classList.toggle('hl',on));}
document.addEventListener('mouseover',e=>{const n=e.target.closest&&e.target.closest('[data-hl]');if(n)hl(n.dataset.hl,true);});
document.addEventListener('mouseout',e=>{const n=e.target.closest&&e.target.closest('[data-hl]');if(n)hl(n.dataset.hl,false);});
function setStage(id,stage){
  const c=CLIENTS.find(x=>x.id===id),cur=S.kstage[id]||'alerta'; if(cur===stage) return;
  S.kstage[id]=stage; const lab=KST.find(k=>k[0]===stage)[1];
  log('Ação do cliente atualizada',`${c.n} · ${lab.toLowerCase()}`,'');render();toast(`${c.n}: ${lab.toLowerCase()}.`);
}
let dragId=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('.kcard');if(!k)return;dragId=k.dataset.id;k.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(err){}});
document.addEventListener('dragend',e=>{document.querySelectorAll('.kcard.dragging').forEach(n=>n.classList.remove('dragging'));document.querySelectorAll('.kcol.over').forEach(n=>n.classList.remove('over'));dragId=null;});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(n=>n!==col&&n.classList.remove('over'));col.classList.add('over');});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col||!dragId)return;e.preventDefault();const id=dragId;dragId=null;setStage(id,col.dataset.stage);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sheet||S.modal||S.msheet||S.add)){closeLayers();render();}});

const h0=(location.hash||'').slice(1);if(PAGES[h0]) S.page=h0;
render();
})();
</script>
